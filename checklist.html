<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Checklist — Admissions & Enrolments Hub</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#123b3a;background:linear-gradient(180deg,#168F87 0,#25A79E 90px,#3FB4AC 190px,#D9F3F0 360px,#fff 500px) no-repeat,#fff}.wrap{max-width:1024px;margin:auto;padding:28px 18px 60px}.brand{color:#fff;font-weight:900;font-size:28px}.sub{color:#dce94b;font-weight:800;letter-spacing:.18em;font-size:11px}.nav{display:flex;gap:22px;flex-wrap:wrap;margin:26px 0 28px}.nav a{color:#fff;text-decoration:none;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.nav a.active{color:#e4ef4e;border-bottom:2px solid #e4ef4e;padding-bottom:8px}.hero{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:20px;border-radius:18px;color:#fff}.hero h1{margin:0;font-size:26px}.controls,.card{background:#fff;border:1px solid #dcebea;border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 8px 28px rgba(18,59,58,.07)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.tabs button,.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.tabs button{background:#eef5f4}.tabs button.on,.btn.primary{background:#dce94b;color:#173d3b}.btn.secondary{background:#eef7f6;color:#176f69;border:1px solid #b8ddda}.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}input,textarea{width:100%;border:1px solid #cfe0de;border-radius:9px;padding:10px;font:inherit}.item{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:14px 0;border-bottom:1px solid #edf2f1}.item:last-child{border-bottom:0}.item input[type=checkbox]{width:21px;height:21px;margin-top:3px}.title{font-weight:800}.req{font-size:13px;color:#5c7775;margin:4px 0 9px}.status{font-size:13px;font-weight:700;margin-left:auto}.ok{color:#16866f}.err{color:#c81e4b}.progress{font-weight:900;margin-left:auto}@media(max-width:650px){.meta{grid-template-columns:1fr}.brand{font-size:22px}.nav{gap:13px}.nav a{font-size:10px}}@media print{body{background:#fff}.nav,.tabs,.actions{display:none}.hero{color:#123b3a;background:#fff;border:1px solid #ccc}.wrap{padding:0}.card,.controls{box-shadow:none}}</style></head><body><div class="wrap"><div class="sub">SCHOOL OF CODING & AI</div><div class="brand">ADMISSIONS & ENROLMENTS HUB</div><nav class="nav"><a href="/">Home</a><a href="/?view=report">Report</a><a href="/?view=staffings">Staffings</a><a href="/?view=kpi">KPI</a><a class="active" href="/checklist.html">Checklist</a><a href="/?view=about">About Team</a></nav><section class="hero"><h1>Admissions Centre Daily Checklist</h1><div style="margin-top:6px;opacity:.9">Morning opening and evening closing checks • saved to the shared team database</div></section><section class="controls"><div class="row"><div class="tabs"><button id="morningBtn" class="on">Morning Opening</button><button id="eveningBtn">Evening Closing</button></div><div class="progress" id="progress">0/11</div></div><div class="meta"><div><label><b>Date</b></label><input id="date" type="date"></div><div><label><b>Completed by</b></label><input id="completedBy" placeholder="Staff member name"></div></div></section><section class="card" id="list"></section><section class="card"><label><b>General notes / handover</b></label><textarea id="notes" rows="3" placeholder="Issues, maintenance requirements or handover notes..."></textarea><div class="row actions" style="margin-top:14px"><button class="btn primary" id="save">Save Checklist</button><button class="btn secondary" onclick="window.print()">Download / Print Report</button><span class="status" id="status"></span></div></section></div><script>const M=[['reception','Reception','Reception area clean, organised and ready for students/visitors'],['sanitary','Sanitary Check','Washrooms and floors checked; any issues reported'],['tables','Tables & Chairs','Tables/chairs correctly positioned and matching where possible'],['pff','PFF Areas','PFF/interview rooms set up correctly and ready'],['files','Files & Folders','No files/folders left in corridors or inappropriate areas'],['tv','TV Screens','Required TVs switched on with slides and music'],['rooms','Cabins / Rooms','Cabins and interview rooms clean and organised'],['desks','Staff Desks','Desks tidy and unnecessary paperwork/items removed'],['floors','Floors & Walkways','Clear, clean and free from obstructions'],['refreshments','Refreshments','Water/refreshment area checked and replenished'],['presentation','Overall Presentation','Final visual check – centre ready for students and external visitors']];const E=[['tables','Tables & Chairs','Returned to their designated positions'],['pff','PFF Areas','PFF/interview areas reset for the following day'],['files','Files & Documents','All documents/folders securely stored & corridors cleared'],['confidential','Confidential Documents','No student information or paperwork left unattended'],['desks','Staff Desks','Working areas left clean and organised'],['rooms','Cabins / Rooms','Rooms checked and left tidy'],['tv','TVs & Screens','All TVs/screens switched off'],['electronics','Electronics','Equipment switched off/returned to designated storage'],['refreshments','Refreshment Area','Cleaned and waste removed'],['floors','Floors & Walkways','Clear of boxes, folders, rubbish and other obstructions'],['final','Final Centre Check','Admissions Centre left clean, professional and ready for next morning']];let period='morning',state={};const $=id=>document.getElementById(id);function localDate(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}function items(){return period==='morning'?M:E}function render(){const a=items();$('list').innerHTML=a.map(([id,t,r])=>`<div class="item"><input type="checkbox" data-id="${id}" ${state[id]?.checked?'checked':''}><div><div class="title">${t}</div><div class="req">${r}</div><input class="note" data-note="${id}" value="${(state[id]?.note||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" placeholder="Issue / note (optional)"></div></div>`).join('');document.querySelectorAll('[data-id]').forEach(x=>x.onchange=()=>{state[x.dataset.id]={...(state[x.dataset.id]||{}),checked:x.checked};prog()});document.querySelectorAll('[data-note]').forEach(x=>x.oninput=()=>state[x.dataset.note]={...(state[x.dataset.note]||{}),note:x.value});prog()}function prog(){$('progress').textContent=`${items().filter(x=>state[x[0]]?.checked).length}/${items().length}`}async function load(){state={};$('completedBy').value='';$('notes').value='';$('status').textContent='Loading...';try{const r=await fetch('/api/checklist?date='+encodeURIComponent($('date').value));const o=await r.json();if(!r.ok)throw Error(o.error||'Load failed');const rec=(o.data||[]).find(x=>x.period===period);if(rec){$('completedBy').value=rec.completed_by||'';$('notes').value=rec.notes||'';(rec.items||[]).forEach(x=>state[x.id]={checked:!!x.checked,note:x.note||''});$('status').textContent='Saved checklist loaded';$('status').className='status ok'}else{$('status').textContent='No checklist saved yet';$('status').className='status'}render()}catch(e){$('status').textContent=e.message;$('status').className='status err';render()}}async function save(){const by=$('completedBy').value.trim();if(!by)return alert('Please enter the staff member completing the checklist.');const payload={date:$('date').value,period,completedBy:by,completedAt:new Date().toISOString(),notes:$('notes').value,items:items().map(([id,title,requirement])=>({id,title,requirement,checked:!!state[id]?.checked,note:state[id]?.note||''}))};$('status').textContent='Saving...';try{const r=await fetch('/api/checklist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const o=await r.json();if(!r.ok)throw Error(o.error||'Save failed');$('status').textContent='✓ Saved to shared database';$('status').className='status ok'}catch(e){$('status').textContent=e.message;$('status').className='status err'}}function setPeriod(p){period=p;$('morningBtn').classList.toggle('on',p==='morning');$('eveningBtn').classList.toggle('on',p==='evening');load()}$('date').value=localDate();$('date').onchange=load;$('morningBtn').onclick=()=>setPeriod('morning');$('eveningBtn').onclick=()=>setPeriod('evening');$('save').onclick=save;load();</script></body></html>
